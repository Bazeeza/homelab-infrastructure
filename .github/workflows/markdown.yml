name: Markdown

on:
  push:
    branches: [main]
    paths: ["**/*.md", "**/*.svg", ".markdownlint-cli2.jsonc", ".github/workflows/markdown.yml"]
  pull_request:
    paths: ["**/*.md", "**/*.svg", ".markdownlint-cli2.jsonc", ".github/workflows/markdown.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Rules are listed in .markdownlint-cli2.jsonc
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # --offline: only links between files of the repository are checked,
      # so an external site being slow cannot make the build fail
      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "./**/*.md"
          fail: true
