name: Public safety

# Runs on every change: a real address or secret must never reach main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Generic rules always run. Real hostnames and domains to hide are kept
      # in the PUBLIC_SAFETY_PATTERNS repository secret (one regex per line),
      # so the list itself is never published. GitHub masks secret values in logs.
      - name: Scan tracked files for real values
        env:
          EXTRA_PATTERNS: ${{ secrets.PUBLIC_SAFETY_PATTERNS }}
        run: bash scripts/check-public-safety.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ShellCheck is preinstalled on GitHub-hosted Ubuntu runners
      - name: ShellCheck every shell script
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then echo "No shell scripts."; exit 0; fi
          shellcheck --severity=style "${scripts[@]}"

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Offline tests: saved ss and Uptime Kuma output, the firewall plan mode,
      # the cross-check in dry-run mode against 127.0.0.1, and the relay
      # installer in dry-run mode against a fake root. No root needed.
      - name: Run the network, monitoring and installer script tests
        run: bash tests/run-tests.sh

  relay-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 and 3.12: the python3 of Ubuntu 22.04 and 24.04 LTS
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Standard library only: nothing to install. The fake Bot API and the
      # fake webhook run on 127.0.0.1, so no Telegram account is needed.
      - name: Compile and test the Telegram relay
        run: |
          python -m py_compile relay/telegram_relay.py
          python -m unittest discover -s tests -p "test_*.py" -v
