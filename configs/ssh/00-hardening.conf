# /etc/ssh/sshd_config.d/00-hardening.conf
#
# SSH hardening drop-in for node-a and node-b (placeholders only).
# Explained line by line in docs/network/ssh-access.md.
#
# Why "00-": Ubuntu's sshd_config starts with
#   Include /etc/ssh/sshd_config.d/*.conf
# and sshd keeps the FIRST value it reads for each keyword. A file read first
# wins over a later one, such as 50-cloud-init.conf, which may turn
# PasswordAuthentication back on.
#
# Apply safely: keep an open session, run `sudo sshd -t`, reload, then test
# from a NEW terminal before closing the old one.

# --- Who may log in, and how -------------------------------------------------
PermitRootLogin no
AllowUsers <ADMIN_USER>
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# --- Slow down guessing --------------------------------------------------------
MaxAuthTries 3
LoginGraceTime 30

# --- Features not needed on a server -----------------------------------------
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
# Local forwards stay allowed: they are how the n8n editor is reached
# (ssh -L 5678:127.0.0.1:5678 <ADMIN_USER>@node-b).
AllowTcpForwarding local

# --- Modern algorithms only ---------------------------------------------------
# Check what the installed OpenSSH supports first: `ssh -Q kex`, `ssh -Q cipher`,
# `ssh -Q mac`. sntrup761x25519 needs OpenSSH 8.5 or later.
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# --- Session hygiene ------------------------------------------------------------
ClientAliveInterval 300
ClientAliveCountMax 2
